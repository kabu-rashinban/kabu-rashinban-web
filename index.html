<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>株の羅針盤</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #1f2937;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 32px 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-top: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    h1 {
      margin-bottom: 8px;
    }

    .sub {
      color: #6b7280;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    .notification {
      background: #2563eb;
      color: white;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <main>

    <h1>🧭 株の羅針盤</h1>

    <div class="sub">
      日本株の監視・IR・株価アラート
    </div>

    <div class="card">
      <h2>🔔 プッシュ通知</h2>

      <p>
        監視銘柄の株価到達や新着IRを通知します。
      </p>

      <button class="notification">
        通知を受け取る
      </button>
    </div>

    <div class="card">
      <h2>＋ 監視銘柄を追加</h2>

      <input
        type="text"
        placeholder="銘柄コード または 銘柄名"
      >

      <button>
        監視銘柄に追加
      </button>
    </div>

    <div class="card">
      <h2>👀 監視銘柄</h2>

      <p>
        ここに登録した銘柄が表示されます。
      </p>
    </div>

  </main>

</body>
</html>
