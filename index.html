<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>株の羅針盤</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">

  <meta name="theme-color" content="#f5f7fa">

  <!-- iPhone / iPad -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="株の羅針盤">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #1f2937;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 32px 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-top: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    h1 {
      margin-bottom: 8px;
    }

    .sub {
      color: #6b7280;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    .notification {
      background: #2563eb;
      color: white;
    }

    .notification.enabled {
      background: #16a34a;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    #notificationStatus {
      margin-top: 14px;
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main>

    <h1>🧭 株の羅針盤</h1>

    <div class="sub">
      日本株の監視・IR・株価アラート
    </div>

    <div class="card">
      <h2>🔔 プッシュ通知</h2>

      <p>
        監視銘柄の株価到達や新着IRを通知します。
      </p>

      <button
        class="notification"
        id="notificationButton"
      >
        通知を受け取る
      </button>

      <div id="notificationStatus"></div>
    </div>

    <div class="card">
      <h2>＋ 監視銘柄を追加</h2>

      <input
        type="text"
        placeholder="銘柄コード または 銘柄名"
      >

      <button>
        監視銘柄に追加
      </button>
    </div>

    <div class="card">
      <h2>👀 監視銘柄</h2>

      <p>
        ここに登録した銘柄が表示されます。
      </p>
    </div>

  </main>

  <script>
    const notificationButton =
      document.getElementById("notificationButton");

    const notificationStatus =
      document.getElementById("notificationStatus");


    // Service Worker 登録
    async function registerServiceWorker() {

      if (!("serviceWorker" in navigator)) {
        throw new Error(
          "このブラウザはService Workerに対応していません。"
        );
      }

      const registration =
        await navigator.serviceWorker.register("./sw.js");

      console.log(
        "Service Worker registered:",
        registration
      );

      return registration;
    }


    // ホーム画面アプリとして起動しているか
    function isStandalone() {

      return (
        window.matchMedia(
          "(display-mode: standalone)"
        ).matches ||
        window.navigator.standalone === true
      );

    }


    // iPhone / iPad判定
    function isIOS() {

      return /iPhone|iPad|iPod/i.test(
        navigator.userAgent
      );

    }


    async function enableNotifications() {

      try {

        if (!("Notification" in window)) {

          alert(
            "このブラウザでは通知機能を利用できません。"
          );

          return;
        }


        /*
          iPhone / iPadでは
          ホーム画面に追加したWebアプリから
          通知を許可する
        */
        if (isIOS() && !isStandalone()) {

          alert(
            "iPhone / iPadでは、まずSafariの共有ボタンから「ホーム画面に追加」してください。\n\nその後、ホーム画面の「株の羅針盤」から開いて、もう一度このボタンを押してください。"
          );

          return;
        }


        notificationStatus.textContent =
          "通知機能を準備しています…";


        const registration =
          await registerServiceWorker();


        const permission =
          await Notification.requestPermission();


        if (permission === "granted") {

          notificationButton.textContent =
            "通知 ON";

          notificationButton.classList.add(
            "enabled"
          );

          notificationStatus.textContent =
            "通知が許可されました。";


          /*
            動作確認用通知
          */
          await registration.showNotification(
            "🧭 株の羅針盤",
            {
              body:
                "通知の準備ができました。重要IRや株価アラートをここに届けます。",
              tag:
                "kabu-rashinban-test",
              data: {
                url: "./"
              }
            }
          );

        } else if (permission === "denied") {

          notificationStatus.textContent =
            "通知が拒否されています。端末の設定から通知を許可してください。";

        } else {

          notificationStatus.textContent =
            "通知の許可が完了しませんでした。";

        }

      } catch (error) {

        console.error(error);

        notificationStatus.textContent =
          "通知の設定中にエラーが発生しました。";

        alert(
          "通知設定でエラーが発生しました。\n" +
          error.message
        );

      }

    }


    notificationButton.addEventListener(
      "click",
      enableNotifications
    );


    // ページ読み込み時にもService Workerを登録
    window.addEventListener(
      "load",
      async () => {

        try {

          await registerServiceWorker();

          if (
            "Notification" in window &&
            Notification.permission === "granted"
          ) {

            notificationButton.textContent =
              "通知 ON";

            notificationButton.classList.add(
              "enabled"
            );

            notificationStatus.textContent =
              "通知は許可されています。";

          }

        } catch (error) {

          console.error(
            "Service Worker registration failed:",
            error
          );

        }

      }
    );
  </script>

</body>
</html>
